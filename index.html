<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no"
  >

  <title>Fichas Individuales</title>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      padding: 10px;
      color: #333;
      margin: 0;
      background: #f4f6f9;
    }

    .contenedor {
      max-width: 850px;
      margin: 0 auto;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 15px;
    }

    h2 {
      font-size: 16px;
      margin: 0 0 15px 0;
      color: #1a73e8;
    }

    h3 {
      font-size: 14px;
      margin-top: 0;
      color: #444;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 5px;
      color: #555;
    }

    select,
    input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
    }

    .botonera {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .botonera button {
      flex: 1;
      min-width: 120px;
    }

    button {
      padding: 12px;
      margin-top: 10px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.2s;
    }

    button.primary {
      background: #1a73e8;
      color: white;
    }

    button.primary:hover {
      background: #1557b0;
    }

    button.success {
      background: #34a853;
      color: white;
    }

    button.success:hover {
      background: #2d8f47;
    }

    button.secondary {
      background: #e0e0e0;
      color: #333;
    }

    button.secondary:hover {
      background: #d0d0d0;
    }

    button.warning {
      background: #f9ab00;
      color: #222;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #f0f0f0;
      white-space: pre-wrap;
      font-size: 12px;
      text-align: center;
    }

    .status.ok {
      background: #d9ead3;
      color: #274e13;
      border: 1px solid #b7d1a3;
    }

    .status.err {
      background: #f4cccc;
      color: #990000;
      border: 1px solid #eababa;
    }

    .status.cargando {
      background: #e8f0fe;
      color: #1a73e8;
      border: 1px solid #b7d1a3;
    }

    .oculto {
      display: none !important;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .tabs button {
      flex: 1;
      margin-top: 0;
    }

    .tab-activo {
      background: #1a73e8 !important;
      color: white !important;
    }

    .lista-alumnos {
      margin-top: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      max-height: 420px;
      overflow-y: auto;
    }

    .fila-alumno {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #eee;
      background: white;
    }

    .fila-alumno:last-child {
      border-bottom: none;
    }

    .fila-alumno input {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .fila-alumno span {
      flex: 1;
      font-size: 14px;
    }

    .seleccionar-todos {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #eef4ff;
      padding: 10px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .seleccionar-todos input {
      width: 20px;
      height: 20px;
    }

    .seleccionar-todos label {
      margin: 0;
    }

    .progreso-box {
      margin-top: 15px;
    }

    .barra {
      width: 100%;
      height: 18px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .barra-interna {
      height: 100%;
      width: 0%;
      background: #1a73e8;
      transition: width .2s;
    }

    .resultado-masivo {
      margin-top: 15px;
    }

    .resultado-item {
      padding: 8px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }

    .resultado-ok {
      color: #1b5e20;
    }

    .resultado-error {
      color: #b71c1c;
    }

    #panelPdf {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f4f6f9;
      z-index: 100;
      overflow-y: auto;
      padding: 10px;
    }

    .toolbar-pdf {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      position: sticky;
      top: 0;
      background: #f4f6f9;
      padding: 5px 0;
      z-index: 10;
    }

    .toolbar-pdf button {
      margin-top: 0;
      flex: 1;
    }

    .pagina-pdf {
      width: 100%;
      margin-bottom: 10px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      padding: 5px;
    }

    .pagina-pdf canvas {
      display: block;
      max-width: 100%;
      height: auto !important;
      margin: 0 auto;
    }

  </style>
</head>

<body>

<div class="contenedor">

  <div class="card">

    <h2>📋 Fichas Individuales</h2>

    <div class="tabs">

      <button
        id="tabIndividual"
        class="secondary tab-activo"
        onclick="mostrarModo('individual')">

        👤 Individual

      </button>

      <button
        id="tabMasivo"
        class="secondary"
        onclick="mostrarModo('masivo')">

        👥 Por curso

      </button>

    </div>


    <!-- ====================================================
         MODO INDIVIDUAL
    ===================================================== -->

    <div id="panelIndividual">

      <label>1. Curso y División</label>

      <select
        id="cursoDivision"
        onchange="cargarAlumnos()">

        <option value="">
          Cargando cursos...
        </option>

      </select>


      <label>2. Alumno</label>

      <select id="alumno">

        <option value="">
          Seleccione un alumno
        </option>

      </select>


      <div class="botonera">

        <button
          id="btnTodo"
          class="primary"
          onclick="generarTodo()">

          📄 Generar Ficha

        </button>


        <button
          id="btnMaterias"
          class="success"
          onclick="cargarMaterias()">

          📚 Cargar Materias

        </button>

      </div>

    </div>


    <!-- ====================================================
         MODO MASIVO
    ===================================================== -->

    <div
      id="panelMasivo"
      class="oculto">

      <label>Curso y División</label>

      <select
        id="cursoDivisionMasivo"
        onchange="cargarAlumnosMasivo()">

        <option value="">
          Cargando cursos...
        </option>

      </select>


      <div
        id="bloqueSeleccionMasiva"
        class="oculto">


        <div class="seleccionar-todos">

          <input
            type="checkbox"
            id="checkTodos"
            onchange="seleccionarTodos(this.checked)">

          <label for="checkTodos">
            Seleccionar todos
          </label>

        </div>


        <div
          id="listaAlumnosMasivo"
          class="lista-alumnos">
        </div>


        <div class="botonera">

          <button
            id="btnGenerarSeleccionados"
            class="success"
            onclick="generarSeleccionados()">

            📄 Generar seleccionados

          </button>

        </div>


        <div
          id="progresoBox"
          class="progreso-box oculto">

          <div id="textoProgreso">
            Preparando...
          </div>

          <div class="barra">

            <div
              id="barraProgreso"
              class="barra-interna">
            </div>

          </div>

        </div>


        <div
          id="resultadoMasivo"
          class="resultado-masivo">
        </div>

      </div>

    </div>


    <div
      class="status oculto"
      id="status">
    </div>

  </div>


  <!-- ======================================================
       VISOR PDF
  ======================================================= -->

  <div
    id="panelPdf"
    class="oculto">

    <div class="toolbar-pdf">

      <button
        class="primary"
        onclick="descargarPdfLocal()">

        ⬇️ Descargar PDF

      </button>

      <button
        class="secondary"
        onclick="cerrarVisor()">

        ✖️ Cerrar

      </button>

    </div>


    <div
      id="estadoRender"
      class="status cargando">

      Preparando visor...

    </div>


    <div id="visorPdf"></div>

  </div>

</div>


<script>

/************************************************************
 * CONFIGURACIÓN
 ************************************************************/

const URL_API =
  "https://script.google.com/macros/s/AKfycbzJigySzNnNNYIFKyIx2JWnAQBu7_O4XcPWpS6tqJRkWiKg_1yRmxDUdpIq0KHJqOJj/exec";


let pdfBase64Memoria = "";

let nombrePdfActual =
  "Ficha.pdf";

let ultimoDniGenerado = "";

let ultimoNombreAlumno = "";

let alumnosMasivos = [];

let procesoMasivoActivo = false;


/************************************************************
 * STATUS
 ************************************************************/

function setStatus(
  msg,
  tipo
) {

  const el =
    document.getElementById(
      "status"
    );


  if (!msg) {

    el.classList.add(
      "oculto"
    );

    return;

  }


  el.classList.remove(
    "oculto"
  );


  el.textContent =
    msg;


  el.className =
    "status " +
    (tipo || "");

}


/************************************************************
 * BOTONES
 ************************************************************/

function bloquearBotones(
  bloquear
) {

  document
    .getElementById(
      "btnTodo"
    )
    .disabled =
      bloquear;


  document
    .getElementById(
      "btnMaterias"
    )
    .disabled =
      bloquear;


  if (bloquear) {

    document
      .getElementById(
        "btnTodo"
      )
      .textContent =
        "⏳ Procesando...";

  }

  else {

    document
      .getElementById(
        "btnTodo"
      )
      .textContent =
        "📄 Generar Ficha";

  }

}


/************************************************************
 * API
 ************************************************************/

async function llamarAPI(
  accion,
  params = {}
) {

  const url =
    new URL(
      URL_API
    );


  url.searchParams.append(
    "accion",
    accion
  );


  Object.keys(params)
    .forEach(
      key => {

        url.searchParams.append(
          key,
          params[key]
        );

      }
    );


  console.log(
    "📡 Llamando:",
    url.toString()
  );


  const response =
    await fetch(
      url.toString()
    );


  if (!response.ok) {

    throw new Error(
      `Error HTTP: ${response.status}`
    );

  }


  const texto =
    await response.text();


  console.log(
    "📥 Respuesta:",
    texto.substring(
      0,
      200
    )
  );


  if (
    !texto
      .trim()
      .startsWith("{")
  ) {

    throw new Error(
      "El servidor devolvió HTML. Verifica la URL."
    );

  }


  try {

    return JSON.parse(
      texto
    );

  }

  catch(e) {

    throw new Error(
      "Error al procesar la respuesta del servidor"
    );

  }

}


/************************************************************
 * INICIALIZAR
 ************************************************************/

async function inicializar() {

  try {

    setStatus(
      "🔄 Cargando cursos...",
      "cargando"
    );


    const res =
      await llamarAPI(
        "obtenerCursos"
      );


    if (!res.ok) {

      throw new Error(
        res.mensaje
      );

    }


    cargarSelectCursos(
      "cursoDivision",
      res.cursos
    );


    cargarSelectCursos(
      "cursoDivisionMasivo",
      res.cursos
    );


    setStatus(
      "✅ " +
      res.cursos.length +
      " cursos cargados",
      "ok"
    );

  }

  catch(err) {

    setStatus(
      "❌ " +
      err.message,
      "err"
    );

    console.error(
      err
    );

  }

}


function cargarSelectCursos(
  id,
  cursos
) {

  const sel =
    document.getElementById(
      id
    );


  sel.innerHTML =
    '<option value="">Seleccionar Curso...</option>';


  cursos.forEach(
    c => {

      const op =
        document.createElement(
          "option"
        );


      op.value =
        c;


      op.textContent =
        c;


      sel.appendChild(
        op
      );

    }
  );

}


/************************************************************
 * CAMBIAR MODO
 ************************************************************/

function mostrarModo(
  modo
) {

  const individual =
    modo ===
    "individual";


  document
    .getElementById(
      "panelIndividual"
    )
    .classList
    .toggle(
      "oculto",
      !individual
    );


  document
    .getElementById(
      "panelMasivo"
    )
    .classList
    .toggle(
      "oculto",
      individual
    );


  document
    .getElementById(
      "tabIndividual"
    )
    .classList
    .toggle(
      "tab-activo",
      individual
    );


  document
    .getElementById(
      "tabMasivo"
    )
    .classList
    .toggle(
      "tab-activo",
      !individual
    );


  setStatus("");

}


/************************************************************
 * INDIVIDUAL - CARGAR ALUMNOS
 ************************************************************/

async function cargarAlumnos() {

  const cursoDiv =
    document
      .getElementById(
        "cursoDivision"
      )
      .value;


  const selAlu =
    document.getElementById(
      "alumno"
    );


  selAlu.innerHTML =
    '<option value="">Cargando...</option>';


  setStatus("");


  if (!cursoDiv) {

    selAlu.innerHTML =
      '<option value="">Seleccione un curso</option>';

    return;

  }


  try {

    const res =
      await llamarAPI(
        "obtenerAlumnos",
        {
          cursoDivision:
            cursoDiv
        }
      );


    if (!res.ok) {

      throw new Error(
        res.mensaje
      );

    }


    selAlu.innerHTML =
      '<option value="">Seleccione un alumno</option>';


    if (
      res.alumnos.length === 0
    ) {

      selAlu.innerHTML =
        '<option value="">Sin alumnos</option>';

      return;

    }


    res.alumnos.forEach(
      a => {

        const op =
          document.createElement(
            "option"
          );


        op.value =
          a.dni;


        op.textContent =
          a.alumno +
          " (DNI " +
          a.dni +
          ")";


        selAlu.appendChild(
          op
        );

      }
    );


    setStatus(
      "✅ " +
      res.alumnos.length +
      " alumnos cargados",
      "ok"
    );

  }

  catch(err) {

    selAlu.innerHTML =
      '<option value="">Error</option>';


    setStatus(
      "❌ " +
      err.message,
      "err"
    );


    console.error(
      err
    );

  }

}


/************************************************************
 * INDIVIDUAL - GENERAR
 ************************************************************/

async function generarTodo() {

  const dni =
    document
      .getElementById(
        "alumno"
      )
      .value;


  const cursoDiv =
    document
      .getElementById(
        "cursoDivision"
      )
      .value;


  if (
    !dni ||
    !cursoDiv
  ) {

    return setStatus(
      "⚠️ Seleccioná Curso y Alumno.",
      "err"
    );

  }


  ultimoDniGenerado =
    dni;


  const selAlu =
    document.getElementById(
      "alumno"
    );


  const nombreCompleto =
    selAlu.options[
      selAlu.selectedIndex
    ]?.text || "";


  ultimoNombreAlumno =
    nombreCompleto
      .split(
        " (DNI"
      )[0] ||
    "";


  setStatus(
    "🔄 Generando ficha...",
    "cargando"
  );


  bloquearBotones(
    true
  );


  pdfBase64Memoria =
    "";


  try {

    const res =
      await llamarAPI(
        "generarFicha",
        {
          dni:
            dni
        }
      );


    if (!res.ok) {

      throw new Error(
        res.mensaje
      );

    }


    /*
     * generarFicha ya completa:
     * datos personales
     * asistencia
     * notas
     * previas/equivalencias
     * materias
     * y devuelve el PDF
     */


    pdfBase64Memoria =
      res.base64;


    nombrePdfActual =
      res.nombreArchivo ||
      "Ficha.pdf";


    setStatus(
      "✅ Ficha completa. Abriendo visor...",
      "ok"
    );


    await mostrarVisorPdf(
      pdfBase64Memoria
    );


    bloquearBotones(
      false
    );

  }

  catch(err) {

    bloquearBotones(
      false
    );


    setStatus(
      "❌ " +
      err.message,
      "err"
    );


    console.error(
      err
    );

  }

}


/************************************************************
 * INDIVIDUAL - CARGAR MATERIAS
 *
 * Se conserva por compatibilidad.
 ************************************************************/

async function cargarMaterias() {

  let dni =
    document
      .getElementById(
        "alumno"
      )
      .value;


  if (!dni) {

    dni =
      ultimoDniGenerado;

  }


  if (!dni) {

    return setStatus(
      "⚠️ Primero generá una ficha o seleccioná un alumno.",
      "err"
    );

  }


  setStatus(
    "🔄 Cargando materias...",
    "cargando"
  );


  document
    .getElementById(
      "btnMaterias"
    )
    .disabled =
      true;


  document
    .getElementById(
      "btnMaterias"
    )
    .textContent =
      "⏳ Cargando...";


  try {

    const res =
      await llamarAPI(
        "cargarMaterias"
      );


    document
      .getElementById(
        "btnMaterias"
      )
      .disabled =
        false;


    document
      .getElementById(
        "btnMaterias"
      )
      .textContent =
        "📚 Cargar Materias";


    if (!res.ok) {

      throw new Error(
        res.mensaje
      );

    }


    setStatus(
      "✅ " +
      res.mensaje +
      ". Actualizando PDF...",
      "cargando"
    );


    const resPDF =
      await llamarAPI(
        "exportarPDF"
      );


    if (resPDF.ok) {

      pdfBase64Memoria =
        resPDF.base64;


      nombrePdfActual =
        resPDF.nombreArchivo ||
        "Ficha.pdf";


      setStatus(
        "✅ PDF actualizado con materias",
        "ok"
      );


      await mostrarVisorPdf(
        pdfBase64Memoria
      );

    }

    else {

      setStatus(
        "⚠️ No se pudo actualizar el PDF",
        "err"
      );

    }

  }

  catch(err) {

    document
      .getElementById(
        "btnMaterias"
      )
      .disabled =
        false;


    document
      .getElementById(
        "btnMaterias"
      )
      .textContent =
        "📚 Cargar Materias";


    setStatus(
      "❌ " +
      err.message,
      "err"
    );


    console.error(
      err
    );

  }

}


/************************************************************
 * MASIVO - CARGAR ALUMNOS
 ************************************************************/

async function cargarAlumnosMasivo() {

  const curso =
    document
      .getElementById(
        "cursoDivisionMasivo"
      )
      .value;


  const lista =
    document.getElementById(
      "listaAlumnosMasivo"
    );


  const bloque =
    document.getElementById(
      "bloqueSeleccionMasiva"
    );


  document
    .getElementById(
      "resultadoMasivo"
    )
    .innerHTML = "";


  document
    .getElementById(
      "checkTodos"
    )
    .checked =
      false;


  if (!curso) {

    bloque.classList.add(
      "oculto"
    );

    return;

  }


  setStatus(
    "🔄 Cargando alumnos...",
    "cargando"
  );


  try {

    const res =
      await llamarAPI(
        "obtenerAlumnos",
        {
          cursoDivision:
            curso
        }
      );


    if (!res.ok) {

      throw new Error(
        res.mensaje
      );

    }


    alumnosMasivos =
      res.alumnos || [];


    lista.innerHTML =
      "";


    alumnosMasivos.forEach(
      (a, index) => {

        const fila =
          document.createElement(
            "div"
          );


        fila.className =
          "fila-alumno";


        fila.innerHTML = `

          <input
            type="checkbox"
            class="check-alumno"
            id="alu_${index}"
            data-index="${index}"
          >

          <span>
            ${escaparHtml(a.alumno)}
            <br>
            <small>
              DNI ${escaparHtml(a.dni)}
            </small>
          </span>

        `;


        lista.appendChild(
          fila
        );

      }
    );


    bloque.classList.remove(
      "oculto"
    );


    setStatus(
      "✅ " +
      alumnosMasivos.length +
      " alumnos cargados",
      "ok"
    );

  }

  catch(err) {

    bloque.classList.add(
      "oculto"
    );


    setStatus(
      "❌ " +
      err.message,
      "err"
    );

  }

}


/************************************************************
 * MASIVO - SELECCIONAR TODOS
 ************************************************************/

function seleccionarTodos(
  estado
) {

  document
    .querySelectorAll(
      ".check-alumno"
    )
    .forEach(
      check => {

        check.checked =
          estado;

      }
    );

}


/************************************************************
 * MASIVO - ALUMNOS SELECCIONADOS
 ************************************************************/

function obtenerSeleccionados() {

  const salida =
    [];


  document
    .querySelectorAll(
      ".check-alumno:checked"
    )
    .forEach(
      check => {

        const index =
          Number(
            check.dataset.index
          );


        if (
          alumnosMasivos[index]
        ) {

          salida.push(
            alumnosMasivos[index]
          );

        }

      }
    );


  return salida;

}


/************************************************************
 * MASIVO - GENERAR
 ************************************************************/

async function generarSeleccionados() {

  if (
    procesoMasivoActivo
  ) {

    return;

  }


  const seleccionados =
    obtenerSeleccionados();


  if (
    seleccionados.length === 0
  ) {

    setStatus(
      "⚠️ Seleccioná al menos un alumno.",
      "err"
    );

    return;

  }


  const confirmar =
    window.confirm(

      "Se generarán " +
      seleccionados.length +
      " fichas.\n\n" +
      "El proceso se hará una por una.\n" +
      "¿Continuar?"

    );


  if (!confirmar) {

    return;

  }


  procesoMasivoActivo =
    true;


  const boton =
    document.getElementById(
      "btnGenerarSeleccionados"
    );


  boton.disabled =
    true;


  boton.textContent =
    "⏳ Generando...";


  const progresoBox =
    document.getElementById(
      "progresoBox"
    );


  const texto =
    document.getElementById(
      "textoProgreso"
    );


  const barra =
    document.getElementById(
      "barraProgreso"
    );


  const resultado =
    document.getElementById(
      "resultadoMasivo"
    );


  progresoBox.classList.remove(
    "oculto"
  );


  resultado.innerHTML =
    "";


  barra.style.width =
    "0%";


  let correctos =
    0;


  let errores =
    0;


  for (
    let i = 0;
    i < seleccionados.length;
    i++
  ) {

    const alumno =
      seleccionados[i];


    const numero =
      i + 1;


    texto.textContent =
      "Generando " +
      numero +
      " de " +
      seleccionados.length +
      ": " +
      alumno.alumno;


    setStatus(
      "🔄 " +
      numero +
      " de " +
      seleccionados.length +
      " - " +
      alumno.alumno,
      "cargando"
    );


    try {

      const res =
        await llamarAPI(
          "generarFicha",
          {
            dni:
              alumno.dni
          }
        );


      if (!res.ok) {

        throw new Error(
          res.mensaje ||
          "Error desconocido"
        );

      }


      if (!res.base64) {

        throw new Error(
          "El servidor no devolvió el PDF."
        );

      }


      /*
       * Descargar solamente la ficha
       * recién generada.
       */

      descargarBase64(
        res.base64,
        res.nombreArchivo ||
        (
          "Ficha - " +
          alumno.alumno +
          ".pdf"
        )
      );


      correctos++;


      agregarResultadoMasivo(
        "✅ " +
        alumno.alumno,
        true
      );

    }

    catch(err) {

      errores++;


      agregarResultadoMasivo(
        "❌ " +
        alumno.alumno +
        " — " +
        err.message,
        false
      );


      console.error(
        alumno,
        err
      );

    }


    const porcentaje =
      Math.round(
        (
          numero /
          seleccionados.length
        ) *
        100
      );


    barra.style.width =
      porcentaje +
      "%";


    /*
     * Pequeña pausa entre alumnos.
     */

    if (
      numero <
      seleccionados.length
    ) {

      await esperar(
        700
      );

    }

  }


  texto.textContent =
    "Proceso terminado";


  setStatus(
    "✅ Proceso terminado.\n" +
    "Generadas: " +
    correctos +
    "\n" +
    "Con error: " +
    errores,
    errores
      ? "err"
      : "ok"
  );


  boton.disabled =
    false;


  boton.textContent =
    "📄 Generar seleccionados";


  procesoMasivoActivo =
    false;

}


/************************************************************
 * RESULTADO MASIVO
 ************************************************************/

function agregarResultadoMasivo(
  texto,
  ok
) {

  const cont =
    document.getElementById(
      "resultadoMasivo"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "resultado-item " +
    (
      ok
        ? "resultado-ok"
        : "resultado-error"
    );


  div.textContent =
    texto;


  cont.appendChild(
    div
  );

}


/************************************************************
 * DESCARGAR PDF MASIVO
 ************************************************************/

function descargarBase64(
  base64,
  nombre
) {

  const bytes =
    base64ABytes(
      base64
    );


  const blob =
    new Blob(
      [bytes],
      {
        type:
          "application/pdf"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    nombre;


  document.body.appendChild(
    link
  );


  link.click();


  document.body.removeChild(
    link
  );


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}


/************************************************************
 * ESPERA
 ************************************************************/

function esperar(
  ms
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/************************************************************
 * VISOR PDF
 ************************************************************/

async function mostrarVisorPdf(
  base64
) {

  document
    .getElementById(
      "panelPdf"
    )
    .classList
    .remove(
      "oculto"
    );


  document
    .getElementById(
      "estadoRender"
    )
    .classList
    .remove(
      "oculto"
    );


  document
    .getElementById(
      "estadoRender"
    )
    .textContent =
      "Abriendo PDF...";


  const bytes =
    base64ABytes(
      base64
    );


  pdfjsLib
    .GlobalWorkerOptions
    .workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  try {

    const pdf =
      await pdfjsLib
        .getDocument({
          data:
            bytes
        })
        .promise;


    const contenedor =
      document.getElementById(
        "visorPdf"
      );


    contenedor.innerHTML =
      "";


    for (
      let num = 1;
      num <= pdf.numPages;
      num++
    ) {

      document
        .getElementById(
          "estadoRender"
        )
        .textContent =
          `Página ${num} de ${pdf.numPages}...`;


      const pagina =
        await pdf.getPage(
          num
        );


      const viewportBase =
        pagina.getViewport({
          scale:
            1
        });


      const ancho =
        contenedor.clientWidth -
        10;


      const escala =
        ancho /
        viewportBase.width;


      const viewport =
        pagina.getViewport({
          scale:
            escala
        });


      const envoltorio =
        document.createElement(
          "div"
        );


      envoltorio.className =
        "pagina-pdf";


      const canvas =
        document.createElement(
          "canvas"
        );


      const contexto =
        canvas.getContext(
          "2d"
        );


      const ratio =
        window.devicePixelRatio ||
        1;


      canvas.width =
        viewport.width *
        ratio;


      canvas.height =
        viewport.height *
        ratio;


      canvas.style.width =
        viewport.width +
        "px";


      canvas.style.height =
        viewport.height +
        "px";


      contexto.scale(
        ratio,
        ratio
      );


      envoltorio.appendChild(
        canvas
      );


      contenedor.appendChild(
        envoltorio
      );


      await pagina.render({

        canvasContext:
          contexto,

        viewport:
          viewport

      }).promise;

    }


    document
      .getElementById(
        "estadoRender"
      )
      .classList
      .add(
        "oculto"
      );


    setStatus(
      "✅ PDF visible - " +
      pdf.numPages +
      " páginas",
      "ok"
    );

  }

  catch(e) {

    document
      .getElementById(
        "estadoRender"
      )
      .textContent =
        "❌ Error al visualizar";


    console.error(
      e
    );

  }

}

/************************************************************
 * BASE64
 ************************************************************/

function base64ABytes(
  base64
) {

  const binario =
    atob(
      base64
    );


  const bytes =
    new Uint8Array(
      binario.length
    );


  for (
    let i = 0;
    i < binario.length;
    i++
  ) {

    bytes[i] =
      binario.charCodeAt(
        i
      );

  }


  return bytes;

}


/************************************************************
 * ESCAPAR HTML
 ************************************************************/

function escaparHtml(
  valor
) {

  return String(
    valor || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}
