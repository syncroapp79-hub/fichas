<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no"
  >

  <title>Fichas Individuales</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 10px;

      font-family:
        system-ui,
        -apple-system,
        sans-serif;

      font-size: 14px;

      color: #333;

      background: #f4f6f9;

    }


    .contenedor {

      max-width: 850px;

      margin: 0 auto;

    }


    .card {

      background: white;

      padding: 16px;

      border-radius: 12px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.07);

      margin-bottom: 15px;

    }


    h2 {

      margin:
        0 0 15px 0;

      font-size: 18px;

      color: #1a73e8;

    }


    label {

      display: block;

      margin-top: 12px;

      margin-bottom: 6px;

      font-weight: bold;

      color: #555;

    }


    select {

      width: 100%;

      padding: 11px;

      font-size: 15px;

      border:
        1px solid #ddd;

      border-radius: 8px;

      background: white;

    }


    button {

      width: 100%;

      padding: 12px;

      margin-top: 12px;

      border: none;

      border-radius: 8px;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

    }


    button.primary {

      background: #1a73e8;

      color: white;

    }


    button.primary:hover {

      background: #1557b0;

    }


    button.success {

      background: #34a853;

      color: white;

    }


    button.success:hover {

      background: #2d8f47;

    }


    button.secondary {

      background: #e0e0e0;

      color: #333;

    }


    button:disabled {

      opacity: .55;

      cursor: wait;

    }


    .status {

      margin-top: 15px;

      padding: 10px;

      border-radius: 8px;

      text-align: center;

      white-space: pre-wrap;

      font-size: 13px;

    }


    .status.ok {

      background: #d9ead3;

      color: #274e13;

      border:
        1px solid #b7d1a3;

    }


    .status.err {

      background: #f4cccc;

      color: #990000;

      border:
        1px solid #eababa;

    }


    .status.cargando {

      background: #e8f0fe;

      color: #1a73e8;

      border:
        1px solid #b7c9ea;

    }


    .oculto {

      display: none !important;

    }


    .seleccionar-todos {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-top: 15px;

      padding: 11px;

      border-radius: 8px;

      background: #eef4ff;

    }


    .seleccionar-todos input {

      width: 21px;

      height: 21px;

      flex:
        0 0 auto;

    }


    .seleccionar-todos label {

      margin: 0;

      cursor: pointer;

    }


    .lista-alumnos {

      margin-top: 10px;

      border:
        1px solid #ddd;

      border-radius: 8px;

      overflow: hidden;

      max-height: 500px;

      overflow-y: auto;

    }


    .fila-alumno {

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 11px;

      border-bottom:
        1px solid #eee;

      background: white;

    }


    .fila-alumno:last-child {

      border-bottom: none;

    }


    .fila-alumno:hover {

      background: #f8fbff;

    }


    .fila-alumno input {

      width: 21px;

      height: 21px;

      flex:
        0 0 auto;

    }


    .datos-alumno {

      flex: 1;

    }


    .nombre-alumno {

      font-weight: 600;

    }


    .dni-alumno {

      margin-top: 2px;

      font-size: 12px;

      color: #777;

    }


    .contador {

      margin-top: 10px;

      font-size: 13px;

      color: #555;

      text-align: right;

    }


    .progreso-box {

      margin-top: 18px;

    }


    .barra {

      width: 100%;

      height: 18px;

      margin-top: 8px;

      background: #e5e7eb;

      border-radius: 10px;

      overflow: hidden;

    }


    .barra-interna {

      width: 0%;

      height: 100%;

      background: #1a73e8;

      transition:
        width .2s;

    }


    .resultado-masivo {

      margin-top: 15px;

    }


    .resultado-item {

      padding: 8px;

      border-bottom:
        1px solid #eee;

      font-size: 13px;

    }


    .resultado-ok {

      color: #1b5e20;

    }


    .resultado-error {

      color: #b71c1c;

    }


    @media (
      max-width: 600px
    ) {

      body {

        padding: 6px;

      }


      .card {

        padding: 13px;

      }


      .lista-alumnos {

        max-height: 430px;

      }

    }

  </style>

</head>


<body>


<div class="contenedor">


  <div class="card">


    <h2>
      📋 Generar Fichas Individuales
    </h2>


    <label>
      Curso y División
    </label>


    <select
      id="cursoDivision"
      onchange="cargarAlumnos()"
    >

      <option value="">
        Cargando cursos...
      </option>

    </select>


    <div
      id="bloqueAlumnos"
      class="oculto"
    >


      <div
        class="seleccionar-todos"
      >

        <input
          type="checkbox"
          id="checkTodos"
          onchange="
            seleccionarTodos(
              this.checked
            )
          "
        >


        <label
          for="checkTodos"
        >

          Seleccionar todos

        </label>

      </div>


      <div
        id="contador"
        class="contador"
      >

        0 seleccionados

      </div>


      <div
        id="listaAlumnos"
        class="lista-alumnos"
      >
      </div>


      <button
        id="btnGenerar"
        class="success"
        onclick="
          generarSeleccionados()
        "
      >

        📄 Generar seleccionados

      </button>


      <div
        id="progresoBox"
        class="progreso-box oculto"
      >

        <div
          id="textoProgreso"
        >

          Preparando...

        </div>


        <div
          class="barra"
        >

          <div
            id="barraProgreso"
            class="barra-interna"
          >
          </div>

        </div>

      </div>


      <div
        id="resultadoMasivo"
        class="resultado-masivo"
      >
      </div>


    </div>


    <div
      id="status"
      class="status oculto"
    >
    </div>


  </div>


</div>


<script>


/************************************************************
 * API
 ************************************************************/

const URL_API =
  "https://script.google.com/macros/s/AKfycbzJigySzNnNNYIFKyIx2JWnAQBu7_O4XcPWpS6tqJRkWiKg_1yRmxDUdpIq0KHJqOJj/exec";


let alumnosCurso =
  [];


let procesoActivo =
  false;


/************************************************************
 * INICIO
 ************************************************************/

window.onload =
  inicializar;


/************************************************************
 * STATUS
 ************************************************************/

function setStatus(
  mensaje,
  tipo
) {

  const el =
    document.getElementById(
      "status"
    );


  if (!mensaje) {

    el.classList.add(
      "oculto"
    );

    el.textContent =
      "";

    return;

  }


  el.className =
    "status " +
    (tipo || "");


  el.textContent =
    mensaje;


  el.classList.remove(
    "oculto"
  );

}


/************************************************************
 * LLAMAR API
 ************************************************************/

async function llamarAPI(
  accion,
  params = {}
) {

  const url =
    new URL(
      URL_API
    );


  url.searchParams.set(
    "accion",
    accion
  );


  Object
    .entries(params)
    .forEach(
      ([key, value]) => {

        url.searchParams.set(
          key,
          value
        );

      }
    );


  const response =
    await fetch(
      url.toString(),
      {
        cache:
          "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      "Error HTTP " +
      response.status
    );

  }


  const texto =
    await response.text();


  if (
    !texto
      .trim()
      .startsWith("{")
  ) {

    throw new Error(
      "El servidor no devolvió una respuesta válida."
    );

  }


  return JSON.parse(
    texto
  );

}


/************************************************************
 * CARGAR CURSOS
 ************************************************************/

async function inicializar() {

  try {

    setStatus(
      "🔄 Cargando cursos...",
      "cargando"
    );


    const res =
      await llamarAPI(
        "obtenerCursos"
      );


    if (!res.ok) {

      throw new Error(
        res.mensaje
      );

    }


    const select =
      document.getElementById(
        "cursoDivision"
      );


    select.innerHTML =
      '<option value="">Seleccionar Curso...</option>';


    res.cursos.forEach(
      curso => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          curso;


        option.textContent =
          curso;


        select.appendChild(
          option
        );

      }
    );


    setStatus(
      "✅ Cursos cargados",
      "ok"
    );

  }

  catch(error) {

    setStatus(
      "❌ " +
      error.message,
      "err"
    );

  }

}


/************************************************************
 * CARGAR ALUMNOS DEL CURSO
 ************************************************************/

async function cargarAlumnos() {

  const curso =
    document
      .getElementById(
        "cursoDivision"
      )
      .value;


  const bloque =
    document
      .getElementById(
        "bloqueAlumnos"
      );


  const lista =
    document
      .getElementById(
        "listaAlumnos"
      );


  document
    .getElementById(
      "resultadoMasivo"
    )
    .innerHTML =
      "";


  document
    .getElementById(
      "checkTodos"
    )
    .checked =
      false;


  document
    .getElementById(
      "progresoBox"
    )
    .classList
    .add(
      "oculto"
    );


  actualizarContador();


  if (!curso) {

    bloque.classList.add(
      "oculto"
    );

    return;

  }


  try {

    setStatus(
      "🔄 Cargando alumnos...",
      "cargando"
    );


    const res =
      await llamarAPI(
        "obtenerAlumnos",
        {
          cursoDivision:
            curso
        }
      );


    if (!res.ok) {

      throw new Error(
        res.mensaje
      );

    }


    alumnosCurso =
      res.alumnos || [];


    lista.innerHTML =
      "";


    alumnosCurso.forEach(
      (alumno, index) => {

        const fila =
          document.createElement(
            "div"
          );


        fila.className =
          "fila-alumno";


        fila.innerHTML = `

          <input
            type="checkbox"
            class="check-alumno"
            id="alumno_${index}"
            data-index="${index}"
            onchange="actualizarContador()"
          >

          <label
            for="alumno_${index}"
            class="datos-alumno"
          >

            <div
              class="nombre-alumno"
            >

              ${escaparHtml(
                alumno.alumno
              )}

            </div>

            <div
              class="dni-alumno"
            >

              DNI:
              ${escaparHtml(
                alumno.dni
              )}

            </div>

          </label>

        `;


        lista.appendChild(
          fila
        );

      }
    );


    bloque.classList.remove(
      "oculto"
    );


    actualizarContador();


    setStatus(
      "✅ " +
      alumnosCurso.length +
      " alumnos cargados",
      "ok"
    );

  }

  catch(error) {

    bloque.classList.add(
      "oculto"
    );


    setStatus(
      "❌ " +
      error.message,
      "err"
    );

  }

}


/************************************************************
 * SELECCIONAR TODOS
 ************************************************************/

function seleccionarTodos(
  estado
) {

  document
    .querySelectorAll(
      ".check-alumno"
    )
    .forEach(
      check => {

        check.checked =
          estado;

      }
    );


  actualizarContador();

}


/************************************************************
 * CONTADOR
 ************************************************************/

function actualizarContador() {

  const checks =
    document.querySelectorAll(
      ".check-alumno"
    );


  const seleccionados =
    document.querySelectorAll(
      ".check-alumno:checked"
    );


  document
    .getElementById(
      "contador"
    )
    .textContent =

      seleccionados.length +
      " seleccionados de " +
      checks.length;


  const checkTodos =
    document.getElementById(
      "checkTodos"
    );


  if (
    checks.length > 0
  ) {

    checkTodos.checked =
      seleccionados.length ===
      checks.length;

  }

}


/************************************************************
 * OBTENER SELECCIONADOS
 ************************************************************/

function obtenerSeleccionados() {

  const resultado =
    [];


  document
    .querySelectorAll(
      ".check-alumno:checked"
    )
    .forEach(
      check => {

        const index =
          Number(
            check.dataset.index
          );


        if (
          alumnosCurso[index]
        ) {

          resultado.push(
            alumnosCurso[index]
          );

        }

      }
    );


  return resultado;

}


/************************************************************
 * GENERAR FICHAS
 ************************************************************/

async function generarSeleccionados() {

  if (
    procesoActivo
  ) {

    return;

  }


  const seleccionados =
    obtenerSeleccionados();


  if (
    seleccionados.length === 0
  ) {

    setStatus(
      "⚠️ Seleccioná al menos un alumno.",
      "err"
    );

    return;

  }


  const confirmar =
    window.confirm(

      "Se generarán " +
      seleccionados.length +
      " ficha(s).\n\n" +
      "¿Continuar?"

    );


  if (!confirmar) {

    return;

  }


  procesoActivo =
    true;


  const boton =
    document.getElementById(
      "btnGenerar"
    );


  const progreso =
    document.getElementById(
      "progresoBox"
    );


  const textoProgreso =
    document.getElementById(
      "textoProgreso"
    );


  const barra =
    document.getElementById(
      "barraProgreso"
    );


  const resultado =
    document.getElementById(
      "resultadoMasivo"
    );


  boton.disabled =
    true;


  boton.textContent =
    "⏳ Generando...";


  progreso.classList.remove(
    "oculto"
  );


  barra.style.width =
    "0%";


  resultado.innerHTML =
    "";


  let correctos =
    0;


  let errores =
    0;


  for (
    let i = 0;
    i < seleccionados.length;
    i++
  ) {

    const alumno =
      seleccionados[i];


    const numero =
      i + 1;


    textoProgreso.textContent =

      "Generando " +
      numero +
      " de " +
      seleccionados.length +
      ": " +
      alumno.alumno;


    setStatus(

      "🔄 " +
      numero +
      " de " +
      seleccionados.length +
      "\n" +
      alumno.alumno,

      "cargando"

    );


    try {

      const res =
        await llamarAPI(
          "generarFicha",
          {
            dni:
              alumno.dni
          }
        );


      if (!res.ok) {

        throw new Error(
          res.mensaje ||
          "Error desconocido"
        );

      }


      if (!res.base64) {

        throw new Error(
          "No se recibió el PDF."
        );

      }


      descargarBase64(

        res.base64,

        res.nombreArchivo ||
        (
          "Ficha - " +
          alumno.alumno +
          ".pdf"
        )

      );


      correctos++;


      agregarResultado(

        "✅ " +
        alumno.alumno,

        true

      );

    }

    catch(error) {

      errores++;


      agregarResultado(

        "❌ " +
        alumno.alumno +
        " — " +
        error.message,

        false

      );

    }


    const porcentaje =
      Math.round(
        (
          numero /
          seleccionados.length
        ) *
        100
      );


    barra.style.width =
      porcentaje +
      "%";


    /*
     * Pausa pequeña antes del siguiente alumno.
     */

    if (
      numero <
      seleccionados.length
    ) {

      await esperar(
        700
      );

    }

  }


  textoProgreso.textContent =
    "Proceso terminado";


  setStatus(

    "✅ Proceso terminado\n\n" +
    "Generadas: " +
    correctos +
    "\n" +
    "Con error: " +
    errores,

    errores > 0
      ? "err"
      : "ok"

  );


  boton.disabled =
    false;


  boton.textContent =
    "📄 Generar seleccionados";


  procesoActivo =
    false;

}


/************************************************************
 * RESULTADOS
 ************************************************************/

function agregarResultado(
  texto,
  correcto
) {

  const contenedor =
    document.getElementById(
      "resultadoMasivo"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "resultado-item " +
    (
      correcto
        ? "resultado-ok"
        : "resultado-error"
    );


  div.textContent =
    texto;


  contenedor.appendChild(
    div
  );

}


/************************************************************
 * DESCARGAR PDF
 ************************************************************/

function descargarBase64(
  base64,
  nombreArchivo
) {

  const binario =
    atob(
      base64
    );


  const bytes =
    new Uint8Array(
      binario.length
    );


  for (
    let i = 0;
    i < binario.length;
    i++
  ) {

    bytes[i] =
      binario.charCodeAt(
        i
      );

  }


  const blob =
    new Blob(
      [bytes],
      {
        type:
          "application/pdf"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const enlace =
    document.createElement(
      "a"
    );


  enlace.href =
    url;


  enlace.download =
    nombreArchivo;


  document.body.appendChild(
    enlace
  );


  enlace.click();


  document.body.removeChild(
    enlace
  );


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1500
  );

}


/************************************************************
 * ESPERA
 ************************************************************/

function esperar(
  milisegundos
) {

  return new Promise(
    resolve => {

      setTimeout(
        resolve,
        milisegundos
      );

    }
  );

}


/************************************************************
 * ESCAPAR HTML
 ************************************************************/

function escaparHtml(
  valor
) {

  return String(
    valor || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


</script>


</body>

</html>
